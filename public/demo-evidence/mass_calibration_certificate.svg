  <text x="420" y="325" fill="#1e293b" font-family="monospace" font-size="11">± 0.10 mg (0.00010 g)</text>
  <text x="630" y="325" fill="#16a34a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">F1 PASS</text>

